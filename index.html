<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Arnav Mohan | Software Engineer — Backend, Cloud & AI/ML</title>
    <meta
      name="description"
      content="Software Engineering Portfolio of Arnav Mohan — Computer Science Engineer specializing in Backend Engineering, Cloud Infrastructure (GCP/AWS), Full-Stack Systems, and AI/ML Computer Vision."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Failsafe Tailwind Engine so custom P5 tokens ALWAYS render -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              p5: {
                black: '#070709',
                panel: '#101014',
                red: '#E60012',
                crimson: '#B8000E',
                cyan: '#00F0FF',
                white: '#F8F8F8',
                muted: '#A0A0AB',
              },
            },
            fontFamily: {
              display: ['Anton', 'Space Grotesk', 'sans-serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            boxShadow: {
              'p5-red': '6px 6px 0px 0px #E60012',
              'p5-white': '6px 6px 0px 0px #F8F8F8',
              'p5-cyan': '6px 6px 0px 0px #00F0FF',
              'p5-dark': '8px 8px 0px 0px #000000',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#070709] text-[#F8F8F8] antialiased selection:bg-[#E60012] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
